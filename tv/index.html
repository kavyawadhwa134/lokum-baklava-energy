<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lokum &amp; Baklava Energy · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Cairo:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: landscape, one screen, no scrolling. Sizes in rem, and rem follows the screen, so a laptop and a 4K TV show the same picture.
   Start = rings hero left, the two sweets right. Sim = fuel comparison + counter left, the big result right. */
:root{
  --bg:#F3F8FC; --surface:#FFFFFF; --fg:#1E2B5E; --muted:#5A6790; --line:#DCE6F2;
  --navy:#283B84; --navy-deep:#18245A; --sky:#4DB3E6; --sun:#FDB913; --leaf:#3A9A3E;
  --panel:#E6F4FC; --panel-line:#C6E4F6; --btn-fg:#FFFFFF;
  --display:"Barlow Condensed","Cairo","DIN Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Cairo","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  font-size:clamp(10px,min(1.04vw,1.72vh),40px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0;height:100%}
body{color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.35;overflow:hidden}
h1,.num{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:.25rem solid var(--sky);outline-offset:.25rem;border-radius:.8rem}

.wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.3rem;padding:1.5rem 3rem 1.2rem}
section.wrap{height:auto;padding:0;gap:0;min-height:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
.brand{display:flex;align-items:center;gap:.8rem;font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;color:var(--navy);background:none;border:0;padding:0;text-align:start}
.brand b{color:var(--sky);font-weight:700}
.brand svg{width:3.4rem;height:3.4rem}
.controls{display:flex;align-items:center;gap:.8rem}
.lang{display:flex;border:.12rem solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;min-width:4.4rem;height:3rem;padding:0 1.1rem;font-weight:600;font-size:1.25rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--btn-fg)}
.tool{height:3rem;border-radius:999px;border:.12rem solid var(--line);background:var(--surface);color:var(--navy);font-weight:600;font-size:1.15rem;padding:0 1.2rem;display:inline-flex;align-items:center;gap:.5rem}
.tool svg{width:1.3rem;height:1.3rem}
.tool[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--navy-deep)}

/* Start screen */
#start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:4rem}
.hero{position:relative;width:min(100%,34rem);aspect-ratio:1/1;justify-self:center}
.hero svg.rings{position:absolute;inset:0;width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .inner{position:absolute;inset:17%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6rem}
.eyebrow{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.hero h1{font-size:4.4rem;line-height:.95;color:var(--navy);text-transform:uppercase}
.start-right{display:flex;flex-direction:column;gap:1.8rem;min-width:0}
.qsub{color:var(--muted);font-size:1.9rem;line-height:1.3;max-width:28ch}
.lead{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--fg);line-height:1.1}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
.pick{background:var(--surface);border:.15rem solid var(--line);border-radius:2rem;padding:1.6rem 1rem 1.8rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;
  box-shadow:0 .5rem 1.6rem rgba(40,59,132,.08);transition:transform .15s,border-color .15s,box-shadow .15s}
.pick:hover{transform:translateY(-.3rem);border-color:var(--sky);box-shadow:0 .9rem 2rem rgba(40,59,132,.14)}
.pick svg{width:12rem;height:12rem}
.pick .name{font-family:var(--display);font-weight:800;font-size:3rem;text-transform:uppercase;color:var(--navy);line-height:1}
.pick .tap{font-size:1.2rem;color:var(--muted)}
.pick kbd{font-family:var(--body);font-weight:700;font-size:1rem;border:.1rem solid var(--line);border-bottom-width:.22rem;border-radius:.4rem;padding:.05rem .45rem;color:var(--navy);background:var(--bg)}

/* Simulation */
#sim{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.45fr);gap:2.4rem;align-items:stretch}
.left{display:flex;flex-direction:column;gap:1.4rem;min-height:0}
.same{background:var(--surface);border:.12rem solid var(--line);border-radius:1.8rem;padding:1.2rem 1.4rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;text-align:center}
.same figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.3rem;min-width:0}
.same svg{width:7rem;height:7rem}
.same figcaption{font-size:1.15rem;color:var(--muted);line-height:1.25}
.same figcaption strong{display:block;color:var(--fg);font-size:1.4rem}
.same .eq{font-family:var(--display);font-weight:800;font-size:3.6rem;color:var(--sky)}

.dock{background:var(--surface);border:.12rem solid var(--line);border-radius:1.8rem;padding:1.3rem 1.6rem 1.3rem;flex:1;display:flex;flex-direction:column;justify-content:center}
.dock-in{display:flex;flex-direction:column;gap:1.1rem}
.counter{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.4rem;direction:ltr}
[dir="rtl"] .counter .mid{direction:rtl}
.mid{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center;gap:.3rem}
.count{font-family:var(--display);font-weight:800;font-size:6.6rem;line-height:.9;color:var(--navy);font-variant-numeric:tabular-nums}
.count.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.1)}}
.countLabel{font-weight:600;font-size:1.35rem;line-height:1.2;color:var(--muted)}
.round{border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;line-height:1;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.round.plus{width:7rem;height:7rem;font-size:4.6rem;background:var(--navy);color:var(--btn-fg);box-shadow:0 .5rem 0 var(--navy-deep)}
.round.plus:active{box-shadow:0 .1rem 0 var(--navy-deep);transform:translateY(.4rem)}
.round.minus{width:5rem;height:5rem;font-size:3.3rem;background:var(--surface);color:var(--navy);border:.15rem solid var(--line)}
.round.minus:active{transform:scale(.93)}
.round:disabled{opacity:.35;cursor:default}
.chips{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.chip{border:.12rem solid var(--line);background:var(--surface);border-radius:999px;height:3.2rem;padding:0 1.4rem;font-weight:600;font-size:1.3rem;color:var(--navy)}
.chip:hover{background:var(--panel)}
.hint{font-size:1.15rem;color:var(--muted);text-align:center}
.left-foot{display:flex;align-items:center;gap:1.2rem}
.switch{align-self:center;background:var(--surface);border:.15rem solid var(--navy);color:var(--navy);border-radius:999px;height:3.6rem;padding:0 1.8rem;font-weight:700;font-size:1.35rem}

.result{background:var(--panel);border:.12rem solid var(--panel-line);border-radius:2.2rem;padding:2rem 2.4rem 1.8rem;display:flex;flex-direction:column;gap:1rem;min-height:0}
.result .pre{font-weight:600;font-size:2.1rem;line-height:1.25;color:var(--fg);text-wrap:balance}
.result .pre b{color:var(--navy);font-weight:800}
.result .big{display:flex;align-items:flex-end;gap:1.4rem;flex-wrap:wrap}
.result .num{font-size:12rem;line-height:.82;color:var(--navy);font-variant-numeric:tabular-nums}
.result .unit{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1.02;text-transform:uppercase;max-width:13ch;color:var(--navy);padding-bottom:.4rem}
.milestone{font-weight:700;font-size:1.7rem;min-height:1.4em;color:var(--fg)}
.milestone:not(:empty)::before{content:"";display:inline-block;width:.9rem;height:.9rem;border-radius:50%;background:var(--sun);margin-inline-end:.8rem;vertical-align:middle}
.street{display:grid;grid-template-columns:repeat(15,1fr);gap:.5rem;align-content:start;flex:none}
.result .spacer{flex:1}
.street svg{width:100%;height:auto;display:block}
.street .h.pop{animation:pop .35s ease-out backwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.legend{font-size:1.15rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.stat{background:var(--surface);border:.12rem solid var(--line);border-radius:1.5rem;padding:1.1rem 1.4rem;display:flex;align-items:baseline;gap:1rem;min-width:0}
.stat .num{font-size:3.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat.coal .num{color:var(--fg)}
.stat.co2 .num{color:var(--leaf)}
.stat p{font-size:1.25rem;color:var(--muted);line-height:1.25}

/* Footer: QR code to the phone version + assumptions */
.bottom{display:flex;align-items:center;justify-content:space-between;gap:2rem}
.foot{font-size:1.05rem;color:var(--muted);max-width:70ch}
.keys{font-size:1rem;color:var(--muted);margin-top:.2rem}
.qr{display:flex;align-items:center;gap:1rem;background:var(--surface);border:.12rem solid var(--line);border-radius:1.2rem;padding:.6rem 1rem .6rem .6rem;flex:none}
.qr .code{width:5.4rem;height:5.4rem;background:#fff;padding:.25rem;border-radius:.4rem}
.qr .code svg{width:100%;height:100%;display:block}
.qr strong{display:block;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--navy);line-height:1.05}
.qr span{font-size:1rem;color:var(--muted)}

:lang(ar) .hero h1{line-height:1.25;font-size:3.8rem}
:lang(ar) .result .unit{line-height:1.3;font-size:2.6rem}
:lang(ar) .result .pre{line-height:1.6;font-size:2rem}
:lang(ar) .lead{line-height:1.4}

@media (prefers-reduced-motion: reduce){
  .hero svg.rings{animation:none}
  .count.bump,.street .h.pop{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" type="button" aria-label="Start">
      <svg viewBox="0 0 200 200" aria-hidden="true" class="mini-rings"></svg>
      <span><b data-t="brand1"></b><br><span data-t="brand2"></span></span>
    </button>
    <div class="controls">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-tr" data-lang="tr">TR</button>
        <button type="button" id="lang-en" data-lang="en">EN</button>
        <button type="button" id="lang-ar" data-lang="ar" lang="ar">عربي</button>
      </div>
      <button class="tool" type="button" id="auto" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg><span data-x="auto"></span>
      </button>
      <button class="tool" type="button" id="full">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span data-x="full"></span>
      </button>
    </div>
  </header>

  <!-- START -->
  <section id="start" class="wrap">
    <div class="hero">
      <svg class="rings" viewBox="0 0 200 200" aria-hidden="true"></svg>
      <div class="inner">
        <span class="eyebrow">COP31 · Türkiye</span>
        <h1 data-t="q"></h1>
      </div>
    </div>
    <div class="start-right">
      <p class="qsub" data-t="qsub"></p>
      <p class="lead" data-t="pick"></p>
      <div class="choose">
        <button class="pick" type="button" id="pick-lokum" data-sweet="lokum">
          <svg viewBox="0 0 100 100" data-draw="lokum" aria-hidden="true"></svg>
          <span class="name" data-name="lokum">Lokum</span>
          <span class="tap"><kbd>L</kbd></span>
        </button>
        <button class="pick" type="button" id="pick-baklava" data-sweet="baklava">
          <svg viewBox="0 0 100 100" data-draw="baklava" aria-hidden="true"></svg>
          <span class="name" data-name="baklava">Baklava</span>
          <span class="tap"><kbd>B</kbd></span>
        </button>
      </div>
    </div>
  </section>

  <!-- SIMULATION -->
  <section id="sim" class="wrap" hidden>
    <div class="left">
      <div class="same">
        <figure>
          <svg viewBox="0 0 100 100" id="sweetPic" aria-hidden="true"></svg>
          <figcaption><strong id="sweetName"></strong><span id="sweetWeight"></span></figcaption>
        </figure>
        <span class="eq" aria-hidden="true">=</span>
        <figure>
          <svg viewBox="0 0 100 100" id="fuelPic" aria-hidden="true"></svg>
          <figcaption><strong data-t="fuel"></strong><span id="fuelWeight"></span></figcaption>
        </figure>
      </div>

      <div class="dock" id="dock" hidden>
        <div class="dock-in">
          <div class="counter">
            <button class="round minus" type="button" id="minus" aria-label="−1">−</button>
            <div class="mid">
              <span class="count" id="count" aria-live="polite">1</span>
              <span class="countLabel" id="countLabel"></span>
            </div>
            <button class="round plus" type="button" id="plus" aria-label="+1">+</button>
          </div>
          <div class="chips">
            <button class="chip" type="button" id="plus10">+10</button>
            <button class="chip" type="button" id="plus100">+100</button>
            <button class="chip" type="button" id="reset" data-t="reset"></button>
          </div>
          <button class="switch" type="button" id="switch"></button>
        </div>
      </div>

    </div>

    <div class="result">
      <p class="pre" id="pre"></p>
      <div class="big">
        <span class="num" id="homes">0</span>
        <span class="unit" data-t="homesUnit"></span>
      </div>
      <p class="milestone" id="milestone"></p>
      <div class="street" id="street" aria-hidden="true"></div>
      <p class="legend" id="legend"></p>
      <div class="spacer"></div>
      <div class="stats">
        <div class="stat coal"><span class="num" id="coal">0</span><p data-t="coal"></p></div>
        <div class="stat co2"><span class="num" id="co2">0</span><p data-t="co2"></p></div>
      </div>
    </div>
    <ul id="howList" hidden></ul>
  </section>

  <footer class="bottom">
    <div>
      <p class="foot" data-x="foot"></p>
      <p class="keys" data-x="keys"></p>
    </div>
    <div class="qr">
      <div class="code" id="qr" aria-hidden="true"></div>
      <div><strong data-x="phone"></strong><span>kavyawadhwa134.github.io/lokum-baklava-energy</span></div>
    </div>
  </footer>
</div>
<script>
(() => {
  // ---------- Physics (kept simple, all assumptions listed in "How we worked it out") ----------
  const FUEL_DENSITY = 10.4;      // g/cm³, uranium dioxide fuel pellet
  const U_SHARE = 0.8815;         // mass share of uranium in UO2
  const BURNUP = 45;              // MWd of heat per kg of uranium (typical light-water reactor)
  const EFFICIENCY = 0.33;        // heat -> electricity
  const HOME_KWH = 2400;          // electricity per Turkish household per year (approx.)
  const COAL_KWH_PER_T = 2500;    // electricity from 1 tonne of coal
  const CO2_SAVED = 0.808;        // kg CO2 per kWh: coal 820 g vs nuclear 12 g (IPCC lifecycle medians)
  const KWH_PER_G = U_SHARE / 1000 * BURNUP * 24 * 1000 * EFFICIENCY; // ≈ 314 kWh per gram of fuel

  const SWEETS = {
    lokum:   { vol: 2.5 * 2.5 * 2.5, sweetG: 20, size: "2.5 × 2.5 × 2.5 cm" },
    baklava: { vol: 4 * 4 * 2.5,     sweetG: 40, size: "4 × 4 × 2.5 cm" }
  };
  for (const s of Object.values(SWEETS)) {
    s.fuelG = s.vol * FUEL_DENSITY;
    s.kwh = s.fuelG * KWH_PER_G;
  }

  // ---------- Text ----------
  const T = {
    en: {
      brand1: "Nuclear for", brand2: "CLIMATE",
      q: "How much energy fits in a sweet?",
      qsub: "Pick your favourite sweet. See how much electricity a uranium pellet of the same size can make.",
      pick: "Lokum or baklava?", tapme: "Tap to choose",
      fuel: "Uranium pellet of the same size",
      sweetW: g => `about ${g} g of sweet`, fuelW: g => `about ${g} g of uranium`,
      countLabel: (n, s) => `${s}-sized uranium ${n === 1 ? "pellet" : "pellets"}`,
      pre: (n, s) => n === 1 ? `A uranium pellet the size of <b>one ${s}</b> can power` : `<b>${fmt(n)} uranium pellets</b>, each the size of a ${s}, can power`,
      hint: "Tap + to add one more piece. Hold it down to go faster.",
      reset: "Back to 1",
      names: { lokum: "Lokum", baklava: "Baklava" },
      homesUnit: "homes for a whole year",
      coal: "tonnes of coal it replaces", co2: "tonnes of CO₂ kept out of the air",
      legend: u => u === 1 ? "Each house = 1 home" : `Each house = ${fmt(u)} homes`,
      switchTo: s => `Try it with ${s === "lokum" ? "lokum" : "baklava"}`,
      how: "How we worked it out",
      miles: [[1,"A home's lights, fridge and tea kettle, all year."],[20,"A whole apartment block."],[50,"A whole street."],[250,"A whole mahalle."],[1000,"A small town."],[10000,"A whole ilçe."],[100000,"A city the size of Antalya's centre."]],
      howList: [
        s => `<strong>Your sweet:</strong> a ${s.size} piece, about ${s.sweetG} g.`,
        s => `<strong>Same size in fuel:</strong> uranium dioxide pellets weigh ${FUEL_DENSITY} g per cm³, so the same piece weighs about ${fmt(Math.round(s.fuelG))} g.`,
        () => `<strong>Energy:</strong> in a typical reactor, 1 g of this fuel makes about ${fmt(Math.round(KWH_PER_G))} kWh of electricity.`,
        () => `<strong>Homes:</strong> a Turkish household uses about ${fmt(HOME_KWH)} kWh of electricity a year.`,
        () => `<strong>Coal and CO₂:</strong> 1 tonne of coal makes about ${fmt(COAL_KWH_PER_T)} kWh. Coal power emits about 820 g CO₂ per kWh over its life cycle; nuclear about 12 g (IPCC).`,
        () => `Figures are rounded and meant to give a feel for scale.`
      ]
    },
    tr: {
      brand1: "Nuclear for", brand2: "CLIMATE",
      q: "Bir tatlıya ne kadar enerji sığar?",
      qsub: "Favori tatlını seç. Aynı büyüklükteki bir uranyum peletinin ne kadar elektrik üretebileceğini gör.",
      pick: "Lokum mu, baklava mı?", tapme: "Seçmek için dokun",
      fuel: "Aynı büyüklükte uranyum peleti",
      sweetW: g => `yaklaşık ${g} g tatlı`, fuelW: g => `yaklaşık ${g} g uranyum`,
      countLabel: (n, s) => `${s} büyüklüğünde uranyum peleti`,
      pre: (n, s) => { const w = s === "lokum" ? "bir lokum" : "bir dilim baklava"; return n === 1 ? `<b>${w[0].toUpperCase() + w.slice(1)}</b> büyüklüğündeki bir uranyum peleti` : `Her biri ${w} büyüklüğündeki <b>${fmt(n)} uranyum peleti</b>`; },
      hint: "Bir parça daha eklemek için + tuşuna dokun. Hızlanmak için basılı tut.",
      reset: "1'e dön",
      names: { lokum: "Lokum", baklava: "Baklava" },
      homesUnit: "evin bir yıllık elektriğini karşılar",
      coal: "ton kömürün yerini alır", co2: "ton CO₂ havaya karışmaz",
      legend: u => u === 1 ? "Her ev simgesi = 1 hane" : `Her ev simgesi = ${fmt(u)} hane`,
      switchTo: s => `Bir de ${s === "lokum" ? "lokumla" : "baklavayla"} dene`,
      how: "Nasıl hesapladık?",
      miles: [[1,"Bir evin ışığı, buzdolabı ve çaydanlığı, bütün yıl."],[20,"Koca bir apartman."],[50,"Bütün bir sokak."],[250,"Koca bir mahalle."],[1000,"Küçük bir kasaba."],[10000,"Bütün bir ilçe."],[100000,"Antalya merkezi büyüklüğünde bir şehir."]],
      howList: [
        s => `<strong>Tatlın:</strong> ${s.size} boyutunda bir parça, yaklaşık ${s.sweetG} g.`,
        s => `<strong>Aynı boyutta yakıt:</strong> uranyum dioksit peletleri cm³ başına ${String(FUEL_DENSITY).replace(".", ",")} g gelir; aynı parça yaklaşık ${fmt(Math.round(s.fuelG))} g olur.`,
        () => `<strong>Enerji:</strong> tipik bir reaktörde bu yakıtın 1 gramı yaklaşık ${fmt(Math.round(KWH_PER_G))} kWh elektrik üretir.`,
        () => `<strong>Haneler:</strong> Türkiye'de bir hane yılda yaklaşık ${fmt(HOME_KWH)} kWh elektrik kullanır.`,
        () => `<strong>Kömür ve CO₂:</strong> 1 ton kömürden yaklaşık ${fmt(COAL_KWH_PER_T)} kWh elektrik elde edilir. Kömür, yaşam döngüsü boyunca kWh başına yaklaşık 820 g CO₂ salar; nükleer yaklaşık 12 g (IPCC).`,
        () => `Rakamlar yuvarlanmıştır; amaç ölçeği hissettirmektir.`
      ]
    },
    ar: {
      brand1: "Nuclear for", brand2: "CLIMATE",
      q: "كم من الطاقة تتّسع لها قطعة حلوى؟",
      qsub: "اختر حلواك المفضّلة، واكتشف كم من الكهرباء يمكن أن تنتجه حبيبة يورانيوم بالحجم نفسه.",
      pick: "لوكوم أم بقلاوة؟", tapme: "اضغط للاختيار",
      fuel: "حبيبة يورانيوم بالحجم نفسه",
      sweetW: g => `نحو ${g} غ من الحلوى`, fuelW: g => `نحو ${g} غ من اليورانيوم`,
      countLabel: (n, s) => `${n === 1 ? "حبيبة يورانيوم" : "حبيبات يورانيوم"} بحجم قطعة ${s === "lokum" ? "لوكوم" : "بقلاوة"}`,
      pre: (n, s) => { const w = s === "lokum" ? "لوكوم" : "بقلاوة"; return n === 1 ? `حبيبة يورانيوم واحدة بحجم <b>قطعة ${w}</b> يمكنها أن تزوّد` : `<b>${fmt(n)} حبيبات يورانيوم</b>، كلٌّ منها بحجم قطعة ${w}، يمكنها أن تزوّد`; },
      hint: "اضغط + لإضافة قطعة أخرى. اضغط مطوّلًا لتسريع العدّ.",
      reset: "العودة إلى 1",
      names: { lokum: "لوكوم", baklava: "بقلاوة" },
      homesUnit: "منزلًا بالكهرباء لعام كامل",
      homesUnitFn: h => { const r = h % 100; return (h >= 3 && h <= 10 ? "منازل" : (r >= 11 && r <= 99 ? "منزلًا" : "منزل")) + " بالكهرباء لعام كامل"; },
      coal: "طن من الفحم يُستغنى عنه", co2: "طن من ثاني أكسيد الكربون لا ينبعث في الهواء",
      legend: u => u === 1 ? "كل رمز = منزل واحد" : `كل رمز = ${fmt(u)} منزل`,
      switchTo: s => `جرّبها مع ${s === "lokum" ? "اللوكوم" : "البقلاوة"}`,
      how: "كيف حسبنا ذلك؟",
      miles: [[1,"إنارة منزل وثلاجته وإبريق الشاي طوال العام."],[20,"عمارة سكنية كاملة."],[50,"شارع كامل."],[250,"حيّ كامل."],[1000,"بلدة صغيرة."],[10000,"منطقة كاملة."],[100000,"مدينة بحجم وسط أنطاليا."]],
      howList: [
        s => `<strong>حلواك:</strong> قطعة بأبعاد <span dir="ltr">${s.size}</span>، وزنها نحو ${s.sweetG} غ.`,
        s => `<strong>الحجم نفسه من الوقود:</strong> تزن حبيبات ثاني أكسيد اليورانيوم ${FUEL_DENSITY} غ لكل سم³، لذا تزن القطعة نفسها نحو ${fmt(Math.round(s.fuelG))} غ.`,
        () => `<strong>الطاقة:</strong> في مفاعل نموذجي، ينتج غرام واحد من هذا الوقود نحو ${fmt(Math.round(KWH_PER_G))} كيلوواط ساعة من الكهرباء.`,
        () => `<strong>المنازل:</strong> يستهلك المنزل في تركيا نحو ${fmt(HOME_KWH)} كيلوواط ساعة من الكهرباء سنويًا.`,
        () => `<strong>الفحم وثاني أكسيد الكربون:</strong> ينتج طن واحد من الفحم نحو ${fmt(COAL_KWH_PER_T)} كيلوواط ساعة. تُطلق محطات الفحم نحو 820 غ من ثاني أكسيد الكربون لكل كيلوواط ساعة على مدى دورة حياتها، مقابل نحو 12 غ للطاقة النووية (IPCC).`,
        () => `الأرقام تقريبية، والهدف منها إعطاء فكرة عن الحجم.`
      ]
    }
  };

  let lang = "en";
  const sys = (navigator.language || "").toLowerCase();
  const guess = sys.startsWith("tr") ? "tr" : sys.startsWith("ar") ? "ar" : "en";
  try { lang = localStorage.getItem("n4c-lang") || guess; if (!T[lang]) lang = guess; } catch (e) {
    lang = guess;
  }
  let sweet = null, n = 1;
  const shown = { homes: 0, coal: 0, co2: 0 };

  function fmt(x, d = 0) {
    return new Intl.NumberFormat(lang === "tr" ? "tr-TR" : lang === "ar" ? "ar-u-nu-latn" : "en-GB", { maximumFractionDigits: d, minimumFractionDigits: d }).format(x);
  }
  const $ = id => document.getElementById(id);

  // ---------- Drawings ----------
  const RING_COLORS = ["#7DC242","#5B2D6E","#E2231A","#FDB913","#4DB3E6","#3A9A3E","#C2187A","#283B84"];
  function rings(svg, sw) {
    const shapes = [[-4,-6,90,88,20],[2,-3,93,90,-35],[3,2,90,92,60],[5,-2,92,89,10],[-2,1,94,92,-10],[-3,3,89,90,45],[-5,4,88,91,-60],[4,5,91,93,80]];
    svg.innerHTML = shapes.map((s, i) =>
      `<ellipse cx="${100+s[0]}" cy="${100+s[1]}" rx="${s[2]}" ry="${s[3]}" transform="rotate(${s[4]} 100 100)" fill="none" stroke="${RING_COLORS[i]}" stroke-width="${sw}"/>`
    ).join("");
  }

  // isometric block: w = half-width, top y, depth of top face, height of sides
  function block(p, flat) {
    const cx = 50, top = flat ? 22 : 12, hw = flat ? 40 : 36, hd = flat ? 18 : 18, h = flat ? 22 : 38;
    const T0 = [cx, top], R = [cx + hw, top + hd], B = [cx, top + 2 * hd], L = [cx - hw, top + hd];
    const pts = a => a.map(q => q.join(",")).join(" ");
    const down = q => [q[0], q[1] + h];
    let s = `<ellipse cx="50" cy="${top + 2*hd + h + 4}" rx="${hw}" ry="5" fill="#000" opacity=".12"/>`;
    s += `<polygon points="${pts([L, B, down(B), down(L)])}" fill="${p.left}"/>`;
    s += `<polygon points="${pts([B, R, down(R), down(B)])}" fill="${p.right}"/>`;
    s += `<polygon points="${pts([T0, R, B, L])}" fill="${p.top}"/>`;
    if (p.layers) { // baklava pastry layers on the sides
      for (let k = 1; k < 6; k++) {
        const y = h * k / 6;
        s += `<polyline points="${L[0]},${L[1]+y} ${B[0]},${B[1]+y} ${R[0]},${R[1]+y}" fill="none" stroke="${p.layers}" stroke-width="1.6" opacity=".8"/>`;
      }
      s += `<polyline points="${L[0]},${L[1]+h*.45} ${B[0]},${B[1]+h*.45} ${R[0]},${R[1]+h*.45}" fill="none" stroke="#7DB343" stroke-width="2.4"/>`;
    }
    if (p.crumbs) { // pistachio on top
      const c = [[50,28],[40,33],[60,33],[50,38],[32,40],[68,40],[44,44],[56,44],[50,50],[38,46],[62,46],[50,34]];
      s += c.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="2.3" fill="${p.crumbs}"/>`).join("");
    }
    if (p.sugar) {
      const c = [[44,22],[58,26],[50,32],[36,30],[64,32],[46,40],[56,38],[24,40],[30,52],[22,60],[34,66],[28,74],[72,44],[76,56],[66,62],[72,72]];
      s += c.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="1.3" fill="#fff" opacity=".9"/>`).join("");
    }
    if (p.shine) {
      s += `<polygon points="${pts([[cx-6,top+6],[cx+14,top+16],[cx+8,top+19],[cx-12,top+9]])}" fill="#fff" opacity=".25"/>`;
    }
    return s;
  }
  const PAL = {
    lokum:   { top:"#F8B9CF", left:"#E27BA2", right:"#C55985", sugar:true },
    baklava: { top:"#E2A33A", left:"#F1C46A", right:"#D39A3A", layers:"#B57A24", crumbs:"#6FA83A" },
    fuel:    { top:"#8A93A3", left:"#5D6676", right:"#454D5B", shine:true }
  };
  const draw = (svg, kind, flat) => svg.innerHTML = block(PAL[kind], flat);

  const HOUSE = (on) => `<svg viewBox="0 0 24 24"><path d="M3 11 L12 4 L21 11 V21 H3 Z" fill="#FDB913" stroke="#E39B00" stroke-width="1.2" stroke-linejoin="round"/>${on ? '<rect x="7" y="13" width="4" height="4" fill="#283B84" opacity=".55"/><rect x="13" y="13" width="4" height="4" fill="#283B84" opacity=".55"/>' : ""}</svg>`;

  // ---------- Render ----------
  function applyText() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-name]").forEach(el => el.textContent = t.names[el.dataset.name]);
    document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
    $("lang-tr").setAttribute("aria-pressed", lang === "tr");
    $("lang-en").setAttribute("aria-pressed", lang === "en");
    $("lang-ar").setAttribute("aria-pressed", lang === "ar");
    if (sweet) renderSim(false);
  }

  function animate(key, el, to, d) {
    const from = shown[key], start = performance.now(), dur = 450;
    shown[key] = to;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { el.textContent = fmt(to, d); return; }
    const step = now => {
      const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3);
      const v = from + (to - from) * e;
      el.textContent = fmt(d ? v : Math.round(v), d);
      if (k < 1 && shown[key] === to) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  let lastIcons = 0, lastUnit = 1;
  function renderStreet(homes) {
    let unit = 1;
    while (homes / unit > 60) unit *= 10;
    const icons = Math.max(1, Math.round(homes / unit));
    const street = $("street");
    if (unit !== lastUnit || icons < lastIcons) { street.innerHTML = ""; lastIcons = 0; }
    for (let i = lastIcons; i < icons; i++) {
      const d = document.createElement("div");
      d.className = "h pop";
      d.style.animationDelay = (Math.min(i - lastIcons, 20) * 18) + "ms";
      d.innerHTML = HOUSE(true);
      street.appendChild(d);
    }
    lastIcons = icons; lastUnit = unit;
    $("legend").textContent = T[lang].legend(unit);
  }

  function renderSim(bump = true) {
    const t = T[lang], s = SWEETS[sweet];
    const kwh = s.kwh * n, homes = Math.round(kwh / HOME_KWH);
    const coal = kwh / COAL_KWH_PER_T, co2 = kwh * CO2_SAVED / 1000;

    $("count").textContent = fmt(n);
    if (bump) { const c = $("count"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
    $("countLabel").textContent = t.countLabel(n, sweet);
    $("pre").innerHTML = t.pre(n, sweet);
    $("minus").disabled = n <= 1;
    $("sweetName").textContent = t.names[sweet];
    document.querySelector("[data-t=homesUnit]").textContent = t.homesUnitFn ? t.homesUnitFn(homes) : t.homesUnit;
    $("sweetWeight").textContent = t.sweetW(s.sweetG);
    $("fuelWeight").textContent = t.fuelW(fmt(Math.round(s.fuelG / 10) * 10));
    animate("homes", $("homes"), homes, 0);
    animate("coal", $("coal"), coal, coal < 10 ? 1 : 0);
    animate("co2", $("co2"), co2, co2 < 10 ? 1 : 0);
    let m = ""; for (const [k, v] of t.miles) if (homes >= k) m = v;
    $("milestone").textContent = m;
    renderStreet(homes);
    $("switch").textContent = t.switchTo(sweet === "lokum" ? "baklava" : "lokum");
    $("howList").innerHTML = t.howList.map(f => `<li>${f(s)}</li>`).join("");
  }

  function go(which) {
    if (which && SWEETS[which]) {
      sweet = which; n = 1;
      shown.homes = shown.coal = shown.co2 = 0;
      $("street").innerHTML = ""; lastIcons = 0; lastUnit = 1;
      draw($("sweetPic"), which, which === "baklava");
      draw($("fuelPic"), "fuel", which === "baklava");
      $("start").hidden = true; $("sim").hidden = false; $("dock").hidden = false;
      renderSim(false);
      window.scrollTo(0, 0);
    } else {
      sweet = null; $("sim").hidden = true; $("dock").hidden = true; $("start").hidden = false;
    }
  }

  function setN(v) {
    n = Math.max(1, Math.min(99999, v));
    renderSim(true);
    try { navigator.vibrate && navigator.vibrate(6); } catch (e) {}
  }

  // tap = +1, hold = repeat, getting faster
  function holdable(btn, fn) {
    let timer = null;
    const stop = () => { clearTimeout(timer); timer = null; };
    btn.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      e.preventDefault();
      fn();
      let delay = 380;
      const loop = () => { timer = setTimeout(() => { fn(); delay = Math.max(45, delay * 0.82); loop(); }, delay); };
      loop();
    });
    ["pointerup", "pointerleave", "pointercancel", "blur"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("contextmenu", e => e.preventDefault());
    btn.addEventListener("click", e => { if (e.detail === 0) fn(); }); // keyboard
  }

  // ---------- Wire up ----------
  rings(document.querySelector(".hero .rings"), 1.6);
  rings(document.querySelector(".mini-rings"), 4);
  document.querySelectorAll("[data-draw]").forEach(svg => draw(svg, svg.dataset.draw, svg.dataset.draw === "baklava"));

  document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.sweet; }));
  $("home").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); go(null); });
  $("switch").addEventListener("click", () => { location.hash = sweet === "lokum" ? "baklava" : "lokum"; });
  holdable($("plus"), () => setN(n + 1));
  holdable($("minus"), () => setN(n - 1));
  $("plus10").addEventListener("click", () => setN(n + 10));
  $("plus100").addEventListener("click", () => setN(n + 100));
  $("reset").addEventListener("click", () => setN(1));
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("n4c-lang", lang); } catch (e) {}
    applyText();
  }));
  window.addEventListener("hashchange", () => go(location.hash.slice(1)));

  applyText();
  go(location.hash.slice(1));
})();
</script>
<script>
// TV extras: keyboard control, auto play, full screen, QR code to the phone version.
(() => {
  const $ = id => document.getElementById(id);
  const PHONE_URL = "https://kavyawadhwa134.github.io/lokum-baklava-energy/";
  const X = {
    en: { auto: "Auto play", full: "Full screen", phone: "Try it on your phone",
          keys: "Keyboard: + and − change the count · L lokum · B baklava · P auto play · F full screen · Esc start",
          foot: "Assumes a typical reactor, 33% of the heat turned into electricity and 2,400 kWh per Turkish home per year. CO₂: IPCC life-cycle medians, coal 820 g vs nuclear 12 g per kWh." },
    tr: { auto: "Otomatik oynat", full: "Tam ekran", phone: "Telefonunda dene",
          keys: "Klavye: + ve − sayıyı değiştirir · L lokum · B baklava · P otomatik oynat · F tam ekran · Esc başa dön",
          foot: "Tipik bir reaktör, ısının %33'ünün elektriğe dönüşmesi ve Türkiye'de hane başına yılda 2.400 kWh varsayılmıştır. CO₂: IPCC yaşam döngüsü medyanları, kWh başına kömür 820 g, nükleer 12 g." },
    ar: { auto: "تشغيل تلقائي", full: "ملء الشاشة", phone: "جرّبها على هاتفك",
          keys: "لوحة المفاتيح: + و − لتغيير العدد · L لوكوم · B بقلاوة · P تشغيل تلقائي · F ملء الشاشة · Esc البداية",
          foot: "نفترض مفاعلًا نموذجيًا، وتحويل 33% من الحرارة إلى كهرباء، واستهلاك 2,400 كيلوواط ساعة لكل منزل تركي سنويًا. ثاني أكسيد الكربون: متوسطات دورة الحياة من IPCC، الفحم 820 غ مقابل 12 غ للنووي لكل كيلوواط ساعة." }
  };
  const applyX = () => {
    const t = X[document.documentElement.lang] || X.en;
    document.querySelectorAll("[data-x]").forEach(el => el.textContent = t[el.dataset.x]);
  };
  new MutationObserver(applyX).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
  applyX();

  // QR code
  try {
    const qr = qrcode(0, "M"); qr.addData(PHONE_URL); qr.make();
    $("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) { document.querySelector(".qr").hidden = true; }

  // Full screen
  const toggleFull = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  $("full").addEventListener("click", toggleFull);

  // Auto play: counts up on its own, then switches sweet and starts again. Good for an unattended TV.
  let timer = null, steps = 0;
  const inSim = () => !$("sim").hidden;
  const count = () => parseInt(($("count").textContent || "1").replace(/\D/g, ""), 10) || 1;
  function tick() {
    if (!inSim()) { location.hash = "lokum"; return; }
    if (count() >= 40) {
      steps++;
      if (steps > 4) { steps = 0; location.hash = location.hash === "#lokum" ? "baklava" : "lokum"; }
      return;
    }
    $("plus").click();
  }
  function setAuto(on) {
    clearInterval(timer); timer = null; steps = 0;
    $("auto").setAttribute("aria-pressed", on);
    if (on) timer = setInterval(tick, 700);
  }
  $("auto").addEventListener("click", () => setAuto(!timer));
  // Any real input stops auto play
  ["minus", "plus", "plus10", "plus100", "reset", "switch", "home", "pick-lokum", "pick-baklava"].forEach(id =>
    $(id).addEventListener("pointerdown", () => timer && setAuto(false)));

  // Keyboard
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const stop = () => { if (timer) setAuto(false); };
    if (["+", "=", "arrowup", "arrowright", " "].includes(k)) {
      if (!inSim()) return; e.preventDefault(); stop(); $("plus").click();
    } else if (["-", "_", "arrowdown", "arrowleft"].includes(k)) {
      if (!inSim()) return; e.preventDefault(); stop(); if (!$("minus").disabled) $("minus").click();
    } else if (k === "l") { stop(); location.hash = "lokum"; }
    else if (k === "b") { stop(); location.hash = "baklava"; }
    else if (k === "0") { if (inSim()) { stop(); $("reset").click(); } }
    else if (k === "p") { setAuto(!timer); }
    else if (k === "f") { toggleFull(); }
    else if (k === "escape" || k === "h") { stop(); $("home").click(); }
  });
})();
</script>
</body>
</html>
